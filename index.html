<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07120e">
<title>FinanPY</title>
<style>
:root{
  --bg:#07120e;--panel:#0d1a15;--panel2:#111f19;--line:#1d352b;
  --text:#f2f7f4;--muted:#94a39b;--green:#10c98b;--green2:#168764;
  --red:#ff6868;--white:#fff;--shadow:0 12px 35px #0004;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;padding-bottom:92px;overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:0 18px}
.hero{position:relative;min-height:300px;padding:42px 0 18px;overflow:hidden}
.brandline{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:3}
.brand{font-size:46px;line-height:.95;font-weight:900;letter-spacing:-3px}
.brand span{color:#42d69e}
.tag{font-size:18px;color:var(--muted);margin-top:12px}
.theme{width:58px;height:58px;border:1px solid var(--line);background:#121a17;color:#fff;border-radius:18px;font-size:27px}
.mascot{position:absolute;right:-6px;top:52px;width:50%;max-width:365px;min-width:250px;height:220px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:1}
.mascot svg{width:100%;height:100%;overflow:visible}
.balanceCard{position:relative;z-index:2;margin-top:22px;background:linear-gradient(135deg,#123d2d,#0e2a20);border:1px solid #19865e;border-radius:28px;padding:24px 26px 22px;box-shadow:var(--shadow)}
.balanceLabel{font-size:18px;color:#c4d4cd}
.balance{margin-top:5px;font-weight:900;font-size:clamp(34px,8.8vw,64px);letter-spacing:-2.5px;white-space:nowrap;overflow:hidden;line-height:1.05}
.balanceEye{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:58px;height:58px;border-radius:18px;border:1px solid var(--line);background:#0a1712;color:#dbe7e1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.stat{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:20px 18px}
.statTop{display:flex;gap:14px;align-items:center}
.statIcon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:31px;flex:none}
.inIcon{color:var(--green);background:#0b392b;border:1px solid #087e59}.outIcon{color:var(--red);background:#351c1c;border:1px solid #713333}
.statLabel{color:#b5c1bb;font-size:16px;line-height:1.15}
.money{font-weight:900;white-space:nowrap;overflow:hidden;letter-spacing:-.8px}
.stat .money{font-size:clamp(19px,4.8vw,31px);margin-top:4px}
.statCount{color:var(--muted);font-size:14px;margin-top:4px}
.section{margin-top:34px}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.section h2{margin:0;font-size:30px;letter-spacing:-1px}
.link{border:0;background:none;color:var(--green);font-weight:800}
.payment{border:1px solid var(--line);background:var(--panel);border-radius:25px;padding:18px 20px;display:flex;align-items:center;gap:16px}
.check{width:62px;height:62px;border-radius:17px;background:#e9eeee;color:#18231e;display:grid;place-items:center;font-size:34px;flex:none}
.payment b{font-size:18px}.payment small{display:block;color:var(--muted);margin-top:4px}
.analysisBtn{border:1px solid var(--line);background:var(--panel);color:#dce6e1;border-radius:22px;padding:14px 18px;font-weight:800}
.chartCard{background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:18px 12px 14px}
.chartWrap{display:grid;grid-template-columns:42px 1fr;gap:8px;height:300px}
.yAxis{display:flex;flex-direction:column;justify-content:space-between;color:#78877f;font-size:11px;text-align:right;padding:4px 0 30px}
.plot{position:relative;border-left:1px solid #263a31;border-bottom:1px solid #263a31;padding:0 6px 0 10px}
.grid{position:absolute;inset:4px 0 30px 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.grid i{display:block;border-top:1px solid #1c3028}
.bars{position:absolute;left:10px;right:0;top:4px;bottom:30px;display:flex;align-items:flex-end;justify-content:space-around;gap:8px}
.barCol{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.bar{width:min(44px,65%);background:linear-gradient(180deg,#18d79a,#087e5b);border-radius:9px 9px 3px 3px;min-height:3px;transition:height .3s ease}
.xLabels{position:absolute;left:10px;right:0;bottom:0;height:28px;display:flex;justify-content:space-around;align-items:flex-end;color:#8d9a94;font-size:12px}
.barValue{font-size:10px;color:#a8b7b0;margin-bottom:4px;white-space:nowrap}
.emptyChart{height:100%;display:grid;place-items:center;color:#68776f;font-size:14px}
.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 18px}
.tab{border:1px solid var(--line);background:#101915;color:#d8e2dd;border-radius:20px;padding:10px 15px;white-space:nowrap}
.tab.on{background:#266c54;border-color:#358c6d}
.list{display:grid;gap:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:15px;display:flex;align-items:center;gap:12px}
.rowMain{flex:1;min-width:0}.rowMain b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rowMain small{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}.dot.red{background:var(--red)}
.amount{font-weight:900;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.green{color:var(--green)}.red{color:var(--red)}
.fab{position:fixed;right:18px;bottom:88px;width:62px;height:62px;border:0;border-radius:50%;background:#158864;color:#fff;font-size:38px;line-height:1;z-index:20;box-shadow:0 12px 30px #0006}
nav{position:fixed;left:0;right:0;bottom:0;height:78px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#151b18ee;backdrop-filter:blur(16px);border-top:1px solid #24322c;display:grid;grid-template-columns:repeat(4,1fr);z-index:19}
.nav{border:0;background:none;color:#89958f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:12px}.nav span{font-size:26px;line-height:1}.nav.on{color:#44d9a0}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:30}.modal.on{display:flex}
.sheet{width:100%;max-height:92vh;overflow:auto;background:#121a17;border-radius:28px 28px 0 0;border:1px solid #26352e;padding:22px 18px calc(25px + env(safe-area-inset-bottom))}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet h2{margin:0;font-size:27px}
.close{width:42px;height:42px;border-radius:50%;border:0;background:#0d1511;color:#fff;font-size:24px}
label{display:block;color:#9aa8a1;font-size:13px;font-weight:800;margin:12px 0 6px}
input,select{width:100%;border:1px solid #293a32;border-radius:16px;background:#0f1713;color:#edf5f1;padding:15px;font-size:16px;outline:none}
.primary{width:100%;border:0;border-radius:16px;background:#178c66;color:#fff;padding:15px;font-weight:900;margin-top:15px}
.secondary{width:100%;border:1px solid #304139;border-radius:16px;background:#16211c;color:#e8f0ec;padding:14px;font-weight:800;margin-top:9px}
.danger{background:#341c1c;border-color:#633232;color:#ff8a8a}
.info{color:#87958e;text-align:center;padding:30px 10px}.switches{display:flex;gap:8px}
.installCard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px}
.installTop{display:flex;justify-content:space-between;gap:10px}.installTop b{font-size:18px}.progress{height:7px;background:#22332b;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--green);border-radius:99px}
.search{margin-bottom:12px}
@media(max-width:430px){.app{padding:0 14px}.hero{min-height:300px}.brand{font-size:42px}.mascot{width:48%;right:-4px;top:55px;height:190px}.balanceCard{margin-top:14px;padding:20px}.stats{gap:10px}.stat{padding:16px 12px}.statIcon{width:50px;height:50px;font-size:27px}.section h2{font-size:28px}}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="brandline">
      <div>
        <div class="brand">Finan<span>PY</span></div>
        <div class="tag">Tu dinero, más claro.</div>
      </div>
      <button class="theme" onclick="toggleDark()" aria-label="Modo oscuro">☾</button>
    </div>
    <div class="mascot" aria-hidden="true">
      <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="214" cy="205" rx="132" ry="11" fill="#0e4d37"/>
        <path d="M90 194c8-67 32-101 82-111 16-3 26-18 39-18 14 0 20 16 35 18 47 7 69 45 70 111z" fill="#9a5b2e"/>
        <path d="M111 157c-6-50 15-76 53-81 35-5 72 13 81 53 9 40-18 69-62 73-40 4-66-12-72-45z" fill="#b76f3a"/>
        <ellipse cx="206" cy="84" rx="72" ry="55" fill="#b97840"/>
        <ellipse cx="249" cy="101" rx="43" ry="33" fill="#a96131"/>
        <circle cx="236" cy="78" r="5" fill="#1b1713"/><circle cx="177" cy="78" r="5" fill="#1b1713"/>
        <path d="M178 63q7-11 18 0M224 63q10-10 19 1" fill="none" stroke="#4a2c1b" stroke-width="4" stroke-linecap="round"/>
        <path d="M225 104q11 9 23 0" fill="none" stroke="#3c2518" stroke-width="4" stroke-linecap="round"/>
        <path d="M199 112q15 16 35 0" fill="none" stroke="#3c2518" stroke-width="4" stroke-linecap="round"/>
        <path d="M118 131q-9 13-20 18" fill="none" stroke="#5b351f" stroke-width="10" stroke-linecap="round"/>
        <path d="M116 126q-19 24-6 67h149q-3-49-29-66l-18 26-44 6z" fill="#087d59"/>
        <path d="M176 151q20 20 38 0v40h-38z" fill="#0b5f45"/>
        <text x="181" y="181" font-family="Arial,sans-serif" font-weight="900" font-size="25" fill="#b8d8c8">PY</text>
        <path d="M267 151q-10 20 5 38h32q-13-27-3-50z" fill="#9b6234"/>
        <ellipse cx="294" cy="183" rx="24" ry="8" fill="#694025"/>
        <path d="M292 174l17-39" stroke="#d9d9d9" stroke-width="5" stroke-linecap="round"/>
        <path d="M283 157q17 6 28 0" stroke="#d7bd8d" stroke-width="4"/>
      </svg>
    </div>
    <div class="balanceCard">
      <div class="balanceLabel">Saldo disponible</div>
      <div class="balance money" id="balance">G. 0</div>
      <button class="balanceEye" onclick="toggleBalance()">◉</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="statTop"><div class="statIcon inIcon">↗</div><div style="min-width:0"><div class="statLabel">Ingresos del mes</div><div id="income" class="money green">G. 0</div><div id="incomeCount" class="statCount">0 movimientos</div></div></div></div>
      <div class="stat"><div class="statTop"><div class="statIcon outIcon">↘</div><div style="min-width:0"><div class="statLabel">Gastos del mes</div><div id="expense" class="money red">G. 0</div><div id="expenseCount" class="statCount">0 movimientos</div></div></div></div>
    </div>
  </header>

  <main id="main"></main>
</div>

<button class="fab" onclick="newTransaction()">+</button>
<nav>
  <button class="nav on" id="nav0" onclick="home()"><span>⌂</span>Inicio</button>
  <button class="nav" id="nav1" onclick="movements()"><span>▤</span>Movimientos</button>
  <button class="nav" id="nav2" onclick="payments()"><span>▦</span>Pagos</button>
  <button class="nav" id="nav3" onclick="settings()"><span>⚙</span>Más</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const KEY='finanpy';
const today=()=>new Date().toISOString().slice(0,10);
const monthKey=d=>d.slice(0,7);
const money=n=>'G. '+Math.round(Number(n)||0).toLocaleString('es-PY');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let data=load();

function load(){
  let x={tx:[],installments:[],subscriptions:[],dark:true};
  try{x={...x,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
  if(!x.tx)x.tx=[];
  if(!x.installments)x.installments=x.ins||[];
  if(!x.subscriptions)x.subscriptions=[];
  if(x.ins)delete x.ins;
  return x;
}
function save(){localStorage.setItem(KEY,JSON.stringify(data));updateHeader()}
function updateHeader(){
  const bal=data.tx.reduce((s,t)=>s+(t.type==='i'?+t.amount:-+t.amount),0);
  const mk=monthKey(today());
  const inc=data.tx.filter(t=>t.type==='i'&&monthKey(t.date)===mk);
  const exp=data.tx.filter(t=>t.type==='e'&&monthKey(t.date)===mk);
  document.getElementById('balance').textContent=money(bal);
  document.getElementById('income').textContent=money(inc.reduce((s,t)=>s+ +t.amount,0));
  document.getElementById('expense').textContent=money(exp.reduce((s,t)=>s+ +t.amount,0));
  document.getElementById('incomeCount').textContent=inc.length+' movimiento'+(inc.length===1?'':'s');
  document.getElementById('expenseCount').textContent=exp.length+' movimiento'+(exp.length===1?'':'s');
  fitMoney();
}
function fitMoney(){
  document.querySelectorAll('.money').forEach(el=>{
    el.style.fontSize='';
    let max=parseFloat(getComputedStyle(el).fontSize);
    const min=el.classList.contains('balance')?26:16;
    while(el.scrollWidth>el.clientWidth && max>min){max-=1;el.style.fontSize=max+'px'}
  })
}
function setNav(n){document.querySelectorAll('.nav').forEach((x,i)=>x.classList.toggle('on',i===n))}
function toggleDark(){data.dark=!data.dark;document.body.classList.toggle('light',!data.dark);document.documentElement.style.setProperty('--bg',data.dark?'#07120e':'#f3f7f5');save()}
function toggleBalance(){const el=document.getElementById('balance');el.dataset.hidden=el.dataset.hidden==='1'?'0':'1';el.textContent=el.dataset.hidden==='1'?'G. •••••••':money(data.tx.reduce((s,t)=>s+(t.type==='i'?+t.amount:-+t.amount),0))}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('es-PY',{day:'2-digit',month:'short'})}
function startOfWeek(){
  const d=new Date();const day=d.getDay()||7;d.setDate(d.getDate()-day+1);d.setHours(12,0,0,0);return d
}
function dateStr(d){return d.toISOString().slice(0,10)}
function expensesByWeek(){
  const start=startOfWeek(),arr=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=dateStr(d);arr.push({label:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][i],value:data.tx.filter(t=>t.type==='e'&&t.date===k).reduce((s,t)=>s+ +t.amount,0)})}
  return arr
}
function monthSeries(){
  const arr=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=d.toISOString().slice(0,7);arr.push({label:d.toLocaleDateString('es-PY',{month:'short'}),value:data.tx.filter(t=>t.type==='e'&&monthKey(t.date)===k).reduce((s,t)=>s+ +t.amount,0)})}return arr
}
function renderChart(arr){
  const maxData=Math.max(0,...arr.map(x=>x.value));const max=Math.max(200000,Math.ceil(maxData/200000)*200000,2000000);
  const ticks=[];for(let v=max;v>=0;v-=200000)ticks.push(v);
  const y=ticks.map(v=>'<span>'+compact(v)+'</span>').join('');
  const grid=ticks.map(()=>'<i></i>').join('');
  const bars=arr.map(x=>{
    const h=maxData?Math.max(2,(x.value/max)*100):2;
    return '<div class="barCol"><div class="barValue">'+(x.value?compact(x.value):'')+'</div><div class="bar" style="height:'+h+'%"></div></div>'
  }).join('');
  return '<div class="chartWrap"><div class="yAxis">'+y+'</div><div class="plot"><div class="grid">'+grid+'</div><div class="bars">'+bars+'</div><div class="xLabels">'+arr.map(x=>'<span>'+x.label+'</span>').join('')+'</div></div></div>';
}
function compact(n){if(n>=1000000)return (n/1000000).toLocaleString('es-PY',{maximumFractionDigits:1})+'M';if(n>=1000)return Math.round(n/1000)+'k';return String(n)}

function home(){
  setNav(0);
  const pending=nextPayment();
  main.innerHTML=`
    <section class="section" style="margin-top:8px">
      <div class="sectionHead"><h2>Próximo pago</h2><button class="link" onclick="payments()">Ver todo ›</button></div>
      <div class="payment">${pending?`<div class="check">!</div><div><b>${esc(pending.name)}</b><small>${pending.label} · ${money(pending.amount)}</small></div>`:`<div class="check">✓</div><div><b>No hay pagos pendientes</b><small>¡Todo al día!</small></div>`}</div>
    </section>
    <section class="section">
      <div class="sectionHead"><h2>Esta semana</h2><button class="analysisBtn" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">Ver análisis ›</button></div>
      <div class="chartCard">${renderChart(expensesByWeek())}</div>
    </section>
    <section class="section">
      <div class="sectionHead"><h2>Resumen mensual</h2></div>
      <div class="chartCard">${renderChart(monthSeries())}</div>
    </section>
    <section class="section">
      <div class="sectionHead"><h2>Gastos por categoría</h2></div>
      <div class="list">${categorySummary()}</div>
    </section>
    <section class="section"><div class="sectionHead"><h2>Últimos movimientos</h2><button class="link" onclick="movements()">Ver más ›</button></div><div class="list">${recentRows()}</div></section>`;
  updateHeader();
}
function categorySummary(){
  const m=monthKey(today()),map={};
  data.tx.filter(t=>t.type==='e'&&monthKey(t.date)===m).forEach(t=>map[t.category]=(map[t.category]||0)+ +t.amount);
  const keys=Object.keys(map).sort((a,b)=>map[b]-map[a]).slice(0,5);
  return keys.length?keys.map(k=>`<div class="row"><i class="dot"></i><div class="rowMain"><b>${esc(k)}</b><small>Gastos del mes</small></div><span class="amount">${money(map[k])}</span></div>`).join(''):'<div class="info">Aún no hay gastos este mes.</div>'
}
function recentRows(){const a=data.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return a.length?a.map(txRow).join(''):'<div class="info">Todavía no tenés movimientos.</div>'}
function txRow(t){return `<div class="row" onclick="editTransaction('${t.id}')"><i class="dot ${t.type==='e'?'red':''}"></i><div class="rowMain"><b>${esc(t.description||t.category)}</b><small>${esc(t.category)} · ${fmtDate(t.date)}</small></div><span class="amount ${t.type==='e'?'red':'green'}">${t.type==='e'?'-':'+'}${money(t.amount)}</span></div>`}

function movements(){
  setNav(1);
  main.innerHTML=`<section class="section" style="margin-top:8px"><div class="sectionHead"><h2>Movimientos</h2><button class="link" onclick="newTransaction()">＋ Agregar</button></div>
  <input class="search" id="search" placeholder="Buscar movimiento..." oninput="filterMoves()">
  <div class="tabs"><button class="tab on" onclick="setMoveType('a',this)">Todos</button><button class="tab" onclick="setMoveType('i',this)">Ingresos</button><button class="tab" onclick="setMoveType('e',this)">Gastos</button></div>
  <div id="moveList" class="list"></div></section>`;
  window.moveType='a';filterMoves()
}
function setMoveType(t,b){window.moveType=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filterMoves()}
function filterMoves(){const q=(document.getElementById('search')?.value||'').toLowerCase();const a=data.tx.filter(t=>(window.moveType==='a'||t.type===window.moveType)&&((t.description||'')+' '+t.category).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));moveList.innerHTML=a.length?a.map(txRow).join(''):'<div class="info">No hay movimientos.</div>'}

function payments(){
  setNav(2);
  main.innerHTML=`<section class="section" style="margin-top:8px"><div class="sectionHead"><h2>Pagos</h2><button class="link" onclick="choosePayment()">＋ Nuevo</button></div>
  <div class="tabs"><button class="tab on" id="tabFinite" onclick="paymentTab('finite',this)">Cuotas</button><button class="tab" onclick="paymentTab('monthly',this)">Mensualidades</button><button class="tab" onclick="paymentTab('calendar',this)">Calendario</button></div>
  <div id="paymentContent"></div></section>`;
  paymentTab('finite',document.getElementById('tabFinite'));
}
function paymentTab(type,b){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const box=document.getElementById('paymentContent');
  if(type==='finite')box.innerHTML=data.installments.length?data.installments.map(installRow).join(''):'<div class="info">No tenés cuotas registradas.</div>';
  if(type==='monthly')box.innerHTML=data.subscriptions.length?data.subscriptions.map(subRow).join(''):'<div class="info">No tenés mensualidades registradas.</div>';
  if(type==='calendar')box.innerHTML=calendarView();
}
function installRow(i){
  const paid=(i.paid||[]).length, pct=i.count?Math.min(100,paid/i.count*100):0, n=Array.from({length:i.count},(_,j)=>j).find(j=>!(i.paid||[]).includes(j));
  return `<div class="installCard" onclick="openInstall('${i.id}')"><div class="installTop"><div><b>${esc(i.name)}</b><div style="color:var(--muted);margin-top:5px">${paid}/${i.count} pagadas${n!==undefined?' · próxima '+fmtDate(due(i,n)):''}</div></div><strong>${money(i.amount)}</strong></div><div class="progress"><i style="width:${pct}%"></i></div></div>`
}
function subRow(s){
  const next=nextSubDate(s.day);
  return `<div class="installCard" onclick="openSub('${s.id}')"><div class="installTop"><div><b>${esc(s.name)}</b><div style="color:var(--muted);margin-top:5px">Mensual · próximo ${fmtDate(next)}</div></div><strong>${money(s.amount)}</strong></div></div>`
}
function choosePayment(){
  sheet.innerHTML=`<div class="sheetHead"><h2>Nuevo pago</h2><button class="close" onclick="closeModal()">×</button></div>
  <button class="primary" onclick="closeModal();installModal()">Cuota</button>
  <button class="secondary" onclick="closeModal();subscriptionModal()">Mensualidad</button>`;
  openModal()
}
function installModal(){
  sheet.innerHTML=`<div class="sheetHead"><h2>Nueva cuota</h2><button class="close" onclick="closeModal()">×</button></div>
  <label>Nombre</label><input id="iName" placeholder="Ej. Celular">
  <label>Monto total (G.)</label><input id="iTotal" type="number" oninput="calcInstall()">
  <label>Cantidad de cuotas</label><input id="iCount" type="number" min="1" value="12" oninput="calcInstall()">
  <label>Monto por cuota (G.)</label><input id="iAmount" type="number">
  <label>Primer vencimiento</label><input id="iStart" type="date" value="${today()}">
  <label>Día de vencimiento</label><input id="iDay" type="number" min="1" max="31" value="${new Date().getDate()}">
  <button class="primary" onclick="saveInstall()">Crear cuota</button>`;
  openModal()
}
function calcInstall(){iAmount.value=Math.round((+iTotal.value||0)/(+iCount.value||1))}
function saveInstall(){
  if(!iName.value||!iTotal.value||!iCount.value||!iAmount.value)return alert('Completá los datos.');
  data.installments.push({id:uid(),name:iName.value,total:+iTotal.value,count:+iCount.value,amount:+iAmount.value,start:iStart.value,day:+iDay.value,paid:[]});
  closeModal();save();payments()
}
function subscriptionModal(){
  sheet.innerHTML=`<div class="sheetHead"><h2>Nueva mensualidad</h2><button class="close" onclick="closeModal()">×</button></div>
  <label>Servicio</label><input id="sName" placeholder="Ej. Wi-Fi, Spotify, Netflix">
  <label>Monto mensual (G.)</label><input id="sAmount" type="number">
  <label>Día de cobro</label><input id="sDay" type="number" min="1" max="31" value="${new Date().getDate()}">
  <label>Categoría</label><select id="sCat"><option>Servicios</option><option>Entretenimiento</option><option>Hogar</option><option>Transporte</option><option>Otros</option></select>
  <button class="primary" onclick="saveSubscription()">Crear mensualidad</button>`;
  openModal()
}
function saveSubscription(){
  if(!sName.value||!sAmount.value)return alert('Completá servicio y monto.');
  data.subscriptions.push({id:uid(),name:sName.value,amount:+sAmount.value,day:+sDay.value,category:sCat.value});
  closeModal();save();payments()
}
function due(i,n){let x=new Date(i.start+'T12:00:00');x.setMonth(x.getMonth()+n);x.setDate(Math.min(i.day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return dateStr(x)}
function nextSubDate(day){let now=new Date();let d=new Date(now.getFullYear(),now.getMonth(),Math.min(day,new Date(now.getFullYear(),now.getMonth()+1,0).getDate()),12);if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate(),12))d.setMonth(d.getMonth()+1);return dateStr(d)}
function nextPayment(){
  const list=[];
  data.installments.forEach(i=>{for(let n=0;n<i.count;n++)if(!(i.paid||[]).includes(n)){const q=due(i,n);if(q>=today())list.push({name:i.name,amount:i.amount,date:q,label:'Cuota '+(n+1)+'/'+i.count})}});
  data.subscriptions.forEach(s=>{const q=nextSubDate(s.day);list.push({name:s.name,amount:s.amount,date:q,label:'Mensualidad'})});
  list.sort((a,b)=>a.date.localeCompare(b.date));return list[0]||null
}
function openInstall(id){
  const i=data.installments.find(x=>x.id===id);const n=Array.from({length:i.count},(_,j)=>j).find(j=>!(i.paid||[]).includes(j));
  sheet.innerHTML=`<div class="sheetHead"><h2>${esc(i.name)}</h2><button class="close" onclick="closeModal()">×</button></div>
  <div class="installCard"><b>Total</b><h2 style="margin:7px 0">${money(i.total)}</h2><div style="color:var(--muted)">${(i.paid||[]).length}/${i.count} cuotas pagadas</div></div>
  ${n===undefined?'<div class="info">Cuota completada ✓</div>':`<button class="primary" onclick="payInstall('${id}',${n})">Pagar cuota ${n+1} · ${money(i.amount)}</button>`}
  <button class="secondary danger" onclick="deleteInstall('${id}')">Eliminar cuota</button>`;
  openModal()
}
function payInstall(id,n){
  const i=data.installments.find(x=>x.id===id);if(!i)return;
  i.paid=i.paid||[];if(i.paid.includes(n))return;
  i.paid.push(n);
  data.tx.push({id:uid(),type:'e',amount:+i.amount,date:today(),category:'Cuotas',description:i.name+' · Cuota '+(n+1)+'/'+i.count});
  closeModal();save();payments()
}
function deleteInstall(id){if(confirm('¿Eliminar esta cuota?')){data.installments=data.installments.filter(x=>x.id!==id);closeModal();save();payments()}}
function openSub(id){
  const s=data.subscriptions.find(x=>x.id===id);
  sheet.innerHTML=`<div class="sheetHead"><h2>${esc(s.name)}</h2><button class="close" onclick="closeModal()">×</button></div>
  <div class="installCard"><b>Mensualidad</b><h2 style="margin:7px 0">${money(s.amount)}</h2><div style="color:var(--muted)">Cobro el día ${s.day} de cada mes</div></div>
  <button class="primary" onclick="paySub('${id}')">Pagar mensualidad</button>
  <button class="secondary danger" onclick="deleteSub('${id}')">Eliminar mensualidad</button>`;
  openModal()
}
function paySub(id){
  const s=data.subscriptions.find(x=>x.id===id);if(!s)return;
  data.tx.push({id:uid(),type:'e',amount:+s.amount,date:today(),category:s.category,description:s.name+' · Mensualidad'});
  closeModal();save();payments()
}
function deleteSub(id){if(confirm('¿Eliminar esta mensualidad?')){data.subscriptions=data.subscriptions.filter(x=>x.id!==id);closeModal();save();payments()}}

function newTransaction(existing){
  const t=existing||{type:'e',amount:'',date:today(),category:'Alimentación',description:''};
  sheet.innerHTML=`<div class="sheetHead"><h2>${existing?'Editar movimiento':'Nuevo movimiento'}</h2><button class="close" onclick="closeModal()">×</button></div>
  <label>Tipo</label><select id="tType"><option value="e">Gasto</option><option value="i">Ingreso</option></select>
  <label>Monto (G.)</label><input id="tAmount" type="number" value="${t.amount}">
  <label>Fecha</label><input id="tDate" type="date" value="${t.date}">
  <label>Categoría</label><select id="tCat">${['Alimentación','Transporte','Vivienda','Estudios','Salud','Entretenimiento','Compras','Trabajo','Servicios','Otros'].map(x=>`<option>${x}</option>`).join('')}</select>
  <label>Descripción</label><input id="tDesc" value="${esc(t.description||'')}" placeholder="Ej. Supermercado">
  <button class="primary" onclick="saveTransaction('${existing?.id||''}')">Guardar</button>
  ${existing?`<button class="secondary danger" onclick="deleteTransaction('${existing.id}')">Eliminar</button>`:''}`;
  tType.value=t.type;tCat.value=t.category;openModal()
}
function editTransaction(id){const t=data.tx.find(x=>x.id===id);if(t)newTransaction(t)}
function saveTransaction(id){
  const x={id:id||uid(),type:tType.value,amount:+tAmount.value,date:tDate.value,category:tCat.value,description:tDesc.value};
  if(!x.amount||!x.date)return alert('Completá monto y fecha.');
  const ix=data.tx.findIndex(t=>t.id===id);if(ix>=0)data.tx[ix]=x;else data.tx.push(x);
  closeModal();save();home()
}
function deleteTransaction(id){if(confirm('¿Eliminar este movimiento?')){data.tx=data.tx.filter(t=>t.id!==id);closeModal();save();movements()}}

function calendarView(){
  const items=[];
  data.installments.forEach(i=>{for(let n=0;n<i.count;n++)if(!(i.paid||[]).includes(n)){const q=due(i,n);if(q>=today())items.push({date:q,name:i.name,label:'Cuota '+(n+1)+'/'+i.count,amount:i.amount})}});
  data.subscriptions.forEach(s=>items.push({date:nextSubDate(s.day),name:s.name,label:'Mensualidad',amount:s.amount}));
  items.sort((a,b)=>a.date.localeCompare(b.date));
  return items.length?items.slice(0,15).map(x=>`<div class="row"><div class="rowMain"><b>${esc(x.name)}</b><small>${fmtDate(x.date)} · ${x.label}</small></div><span class="amount">${money(x.amount)}</span></div>`).join(''):'<div class="info">No hay pagos próximos.</div>'
}
function settings(){
  setNav(3);
  main.innerHTML=`<section class="section" style="margin-top:8px"><div class="sectionHead"><h2>Más</h2></div>
  <div class="list">
    <div class="installCard"><b>FinanPY</b><div style="color:var(--muted);margin-top:7px">Tus datos se guardan en este dispositivo.</div><button class="secondary" onclick="toggleDark()">Cambiar modo</button></div>
    <div class="installCard"><b>Recordatorios</b><div style="color:var(--muted);margin-top:7px">Los pagos se muestran automáticamente según su próxima fecha.</div></div>
    <div class="installCard"><button class="secondary danger" onclick="wipe()">Borrar todos los datos</button></div>
  </div></section>`
}
function openModal(){modal.classList.add('on')}
function closeModal(){modal.classList.remove('on')}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()})
function wipe(){if(confirm('¿Borrar todos los datos de FinanPY?')){data={tx:[],installments:[],subscriptions:[],dark:data.dark};save();home()}}
document.body.classList.toggle('light',!data.dark);
home();
window.addEventListener('resize',fitMoney);
</script>
</body>
</html>
