<script>
const $=id=>document.getElementById(id);
const KEY="finanpy_v2";
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>"G. "+Math.round(Number(n)||0).toLocaleString("es-PY");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function load(){
 try{
  const old=JSON.parse(localStorage.getItem(KEY)||"null");
  if(old){old.subs=old.subs||[];old.goals=old.goals||[];old.cards=old.cards||[];old.settings=old.settings||{reminders:true,face:false,notify:false};old.profile=old.profile||{name:"",currency:"PYG"};return old;}
  const legacy=JSON.parse(localStorage.getItem("finanpy")||"null");
  if(legacy){legacy.subs=legacy.subs||[];legacy.goals=legacy.goals||[];legacy.cards=legacy.cards||[];legacy.settings=legacy.settings||{reminders:true,face:false,notify:false};legacy.profile=legacy.profile||{name:"",currency:"PYG"};localStorage.setItem(KEY,JSON.stringify(legacy));return legacy}
 }catch(e){}
 return {tx:[],ins:[],dark:false,budget:0,subs:[],goals:[],cards:[],settings:{reminders:true,face:false}};
}
let d=load();
if(d.dark)document.body.classList.add("dark");

function persist(){localStorage.setItem(KEY,JSON.stringify(d));updateHeader()}

function fitMoney(){
  const selectors=["#bal","#inc","#exp",".payamount",".amt",".kpis b"];
  const nodes=[...new Set(selectors.flatMap(s=>[...document.querySelectorAll(s)]))];
  nodes.forEach(el=>{
    if(!el || !el.textContent.trim()) return;
    el.classList.add("moneyfit");
    const isBalance=el.id==="bal";
    const isCard=el.id==="inc"||el.id==="exp";
    let size=isBalance?50:(isCard?24:20);
    const min=isBalance?22:(isCard?13:12);
    el.style.fontSize=size+"px";
    el.style.whiteSpace="nowrap";
    el.style.display="block";
    let guard=0;
    while(el.scrollWidth>el.clientWidth+1 && size>min && guard++<40){
      size-=1;
      el.style.fontSize=size+"px";
    }
  });
}
window.addEventListener("resize",fitMoney);

function updateHeader(){
 const bal=d.tx.reduce((s,x)=>s+(x.type==="i"?Number(x.a):-Number(x.a)),0);
 const ym=today().slice(0,7);
 const inc=d.tx.filter(x=>x.type==="i"&&x.date.slice(0,7)===ym).reduce((s,x)=>s+Number(x.a),0);
 const exp=d.tx.filter(x=>x.type==="e"&&x.date.slice(0,7)===ym).reduce((s,x)=>s+Number(x.a),0);
 if($("bal"))$("bal").textContent=money(bal);if($("inc"))$("inc").textContent=money(inc);if($("exp"))$("exp").textContent=money(exp);

function due(i,n){
 const x=new Date(i.start+"T12:00:00");
 x.setMonth(x.getMonth()+n);
 const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();
 x.setDate(Math.min(Number(i.day)||1,last));
 return x.toISOString().slice(0,10);
}
function daysUntil(date){
 const a=new Date(today()+"T12:00:00"),b=new Date(date+"T12:00:00");
 return Math.round((b-a)/86400000);
}
function pending(){
 const a=[];
 d.ins.forEach(i=>{
  for(let n=0;n<i.count;n++){
   if(!(i.paid||[]).some(p=>p.n===n || p===n)){
    const q=due(i,n);a.push({i,n,q,days:daysUntil(q)});
   }
  }
 });
 return a.sort((a,b)=>a.q.localeCompare(b.q));
}

 setActive(3);
 $("main").innerHTML=`<div class="head"><h2>Tarjetas</h2><button class="link" onclick="creditCardModal()">＋ Nueva</button></div>
 <div class="notice">Controlá límite, consumos y fechas de cierre/vencimiento. Los consumos registrados también aparecen en Movimientos.</div>
 <div class="list">${d.cards.length?d.cards.map(c=>{
   const used=Math.min(100,c.balance/c.limit*100);
   return `<div class="e2card"><div class="cardbrand"><b>${esc(c.name)}</b><span class="badge">•••• ${esc(c.last4||"----")}</span></div>
   <div class="ccnum">${money(c.balance)} usado</div><div class="analysisbar"><i style="width:${used}%"></i></div>
   <div class="ccfoot"><span>Límite ${money(c.limit)}</span><span>Disponible ${money(Math.max(0,c.limit-c.balance))}</span></div>
   <div class="ccfoot" style="margin-top:8px"><span>Cierre día ${c.close}</span><span>Vence día ${c.due}</span></div>
   <div class="actions section"><button class="btn" onclick="addCardCharge('${c.id}')">＋ Consumo</button><button class="smallbtn" onclick="creditCardModal('${c.id}')">Editar</button></div></div>`;
 }).join(""):`<div class="empty">Agregá tu primera tarjeta para controlar el límite y los consumos.</div>`}</div>`;
}
function analyticsPage(){
 resetView();
 setActive(3);
 const ym=today().slice(0,7), month=d.tx.filter(x=>x.date.slice(0,7)===ym);
 const income=month.filter(x=>x.type==="i").reduce((s,x)=>s+Number(x.a),0);
 const expense=month.filter(x=>x.type==="e").reduce((s,x)=>s+Number(x.a),0);
 const by={};month.filter(x=>x.type==="e").forEach(x=>by[x.cat]=(by[x.cat]||0)+Number(x.a));
 const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 const top=cats[0], rate=income?expense/income*100:0;
 $("main").innerHTML=`<div class="head"><h2>Análisis</h2><button class="link" onclick="home()">Inicio</button></div>
 <div class="e2grid"><div class="e2card"><small>Ingresos</small><div class="statbig green">${money(income)}</div></div><div class="e2card"><small>Gastos</small><div class="statbig red">${money(expense)}</div></div></div>
 <div class="hero"><small style="color:#d5eee5">Balance del mes</small><h3>${money(income-expense)}</h3><p>${rate?`Tus gastos representan ${rate.toFixed(0)}% de tus ingresos.`:"Todavía no hay ingresos este mes."}</p></div>
 <div class="card section"><b>Gastos por categoría</b>${cats.length?cats.map(([k,v])=>`<div class="section"><div class="head"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="analysisbar"><i style="width:${expense?v/expense*100:0}%"></i></div></div>`).join(""):`<div class="empty">Sin gastos este mes.</div>`}</div>
 ${top?`<div class="card section"><b>Mayor categoría</b><p><span class="badge">${esc(top[0])}</span> ${money(top[1])}</p></div>`:""}
 <div class="card section"><b>Recomendación</b><p><small>${d.budget&&expense>d.budget?"Superaste tu presupuesto mensual. Revisá las categorías con mayor gasto.":d.budget&&expense>d.budget*.8?"Ya usaste más del 80% de tu presupuesto.":"Vas dentro de tu presupuesto. Seguí registrando tus movimientos para obtener mejores análisis."}</small></p></div>`;
}
async function requestNotifications(){
 if(!("Notification" in window))return alert("Safari no ofrece notificaciones web en este contexto.");
 try{const p=await Notification.requestPermission();d.settings.notify=p==="granted";persist();settings();alert(p==="granted"?"Notificaciones permitidas. FinanPY podrá mostrar avisos mientras la app esté abierta.":"No se concedió permiso.");}
 catch(e){alert("No se pudo solicitar el permiso de notificaciones.")}
}
function cloudSyncInfo(){
 $("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Sincronización</h2>
 <div class="syncbox"><b>Estado actual: local</b><p><small>Tus datos están en este iPhone. Para sincronización real entre dispositivos hace falta una cuenta y una base de datos en la nube.</small></p></div>
 <p><small>FinanPY ya tiene exportación/restauración JSON. No voy a simular una nube que todavía no existe.</small></p>
 <button class="btn" onclick="exportData();closeModal()">Crear respaldo ahora</button>`;
 $("modal").classList.add("on");
}

function settings(){
 resetView();
 setActive(3);
 const size=new Blob([JSON.stringify(d)]).size, ym=today().slice(0,7);
 const exp=d.tx.filter(x=>x.type==="e"&&x.date.slice(0,7)===ym).reduce((s,x)=>s+Number(x.a),0);
 const rem=d.budget?Math.max(0,d.budget-exp):0;
 $("main").innerHTML=`<h2>Ajustes y herramientas</h2>
 <div class="hero"><h3>FinanPY Pro+ 🇵🇾</h3><p>Controlá gastos, cuotas, mensualidades, metas y respaldos desde un solo lugar.</p></div>
 <div class="card section"><b>Presupuesto mensual</b><p><small>Gastado: ${money(exp)}${d.budget?` · Disponible: ${money(rem)}`:""}</small></p><input id="budget" type="number" inputmode="numeric" value="${d.budget||""}" placeholder="Ej. 3000000"><button class="btn" onclick="saveBudget()">Guardar presupuesto</button></div>
 <div class="section"><div class="head"><h2>Metas de ahorro</h2><button class="link" onclick="goalModal()">＋ Nueva</button></div><div class="list">${d.goals.length?d.goals.map(g=>`<div class="mini goal"><div class="goalhead"><b>${esc(g.name)}</b><small>${money(g.saved)} / ${money(g.target)}</small></div><div class="progress"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><button class="link" onclick="addGoalMoney('${g.id}')">＋ Agregar ahorro</button></div>`).join(""):`<div class="empty">Creá una meta como auto, viaje o emergencia.</div>`}</div></div>
 <div class="card section"><b>Sincronización</b><p><small>Preparada para conectar una cuenta y sincronizar entre iPhone/iPad en una siguiente etapa.</small></p><button class="btn" onclick="cloudSyncInfo()">Ver estado de sincronización</button></div>
 <div class="card section"><b>Seguridad</b>
 <div class="switch"><span>Bloqueo biométrico / Face ID</span><button class="link" onclick="faceID()">Configurar</button></div>
 <div class="switch"><span>Recordatorios dentro de FinanPY</span><span class="badge">3 días antes</span></div><div class="switch"><span>Permitir notificaciones</span><button class="link" onclick="requestNotifications()">Activar</button></div></div>
 <div class="card section"><b>Herramientas</b><div class="actions"><button class="smallbtn" onclick="analyticsPage()">Análisis</button><button class="smallbtn" onclick="cardsPage()">Tarjetas</button></div></div>
 <div class="card section"><b>Copia de seguridad</b><p><small>${d.tx.length} movimientos · ${d.ins.length} cuotas · ${d.subs.length} mensualidades · ${d.goals.length} metas · ${Math.round(size/1024)} KB</small></p><div class="actions"><button class="btn" onclick="exportData()">Exportar</button><button class="btn" onclick="importData()">Restaurar</button></div></div>
 <div class="card section"><b>Acerca de FinanPY</b><p><small>Una forma simple de entender a dónde va tu dinero.</small></p></div>
 <div class="card section"><b>Datos</b><p><small>Los datos actuales están guardados localmente en este dispositivo.</small></p><button class="btn danger" onclick="wipe()">Borrar todos los datos</button></div>`;
}
function saveBudget(){d.budget=Number($("budget").value)||0;persist();settings()}
function exportData(){
 const blob=new Blob([JSON.stringify({...d,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="FinanPY-respaldo.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(){
 const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
 input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.tx)||!Array.isArray(x.ins))throw 0;if(confirm("Esto reemplazará los datos actuales. ¿Continuar?")){d={tx:x.tx,ins:x.ins,subs:x.subs||[],goals:x.goals||[],cards:x.cards||[],settings:x.settings||{reminders:true,face:false,notify:false},profile:x.profile||{name:"",currency:"PYG"},dark:!!x.dark,budget:Number(x.budget)||0};persist();home()}}catch(e){alert("El archivo no es un respaldo válido de FinanPY.")}};r.readAsText(f)};input.click();
}
function toggleDark(){d.dark=!d.dark;document.body.classList.toggle("dark",d.dark);persist()}
function wipe(){if(confirm("¿Borrar TODOS los datos de FinanPY? Esta acción no se puede deshacer.")){d={tx:[],ins:[],subs:[],goals:[],cards:[],settings:{reminders:true,face:false,notify:false},profile:{name:"",currency:"PYG"},dark:d.dark,budget:0};persist();home()}}
function closeModal(){$("modal").classList.remove("on")}
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
updateHeader();home();
</script>
</body>
</html>
