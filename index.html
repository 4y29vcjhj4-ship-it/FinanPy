<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f5b"><title>FinanPY</title>
<style>
:root{--g:#087f5b;--bg:#f4f7f6;--card:#fff;--t:#17211d;--m:#718078;--l:#e1e9e4;--r:#d64545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding-bottom:80px}header{background:linear-gradient(145deg,#087f5b,#064f3d);color:#fff;padding:20px 16px 24px;border-radius:0 0 25px 25px}.top{display:flex;justify-content:space-between}.brand{font-size:26px;font-weight:800}.sub,small{color:var(--m);font-size:12px}.sub{color:#d5eee5}.balance{margin-top:25px}.balance h1{margin:4px 0;font-size:36px}.wrap{max-width:700px;margin:auto;padding:15px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.card,.row,.up{background:var(--card);border:1px solid var(--l);border-radius:16px;padding:14px}.card b{display:block;font-size:18px;margin-top:5px}.green{color:var(--g)}.red{color:var(--r)}h2{font-size:18px;margin:20px 0 10px}.up{display:flex;justify-content:space-between}.list{display:grid;gap:9px}.row{display:flex;gap:10px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--g)}.dot.r{background:var(--r)}.main{flex:1;min-width:0}.main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.amt{font-weight:800}.btn{border:0;background:var(--g);color:#fff;border-radius:12px;padding:13px 15px;font-weight:800}.link{border:0;background:none;color:var(--g);font-weight:700}.head{display:flex;justify-content:space-between;align-items:center}.chart{height:150px;display:flex;align-items:end;gap:8px}.barw{flex:1;text-align:center}.bar{background:var(--g);border-radius:7px 7px 2px 2px;min-height:4px}.barw small{display:block;margin-top:5px}.fab{position:fixed;right:18px;bottom:75px;width:58px;height:58px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:28px;z-index:5}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--l);display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:6}.nav{border:0;background:none;color:var(--m);font-size:11px}.nav b{display:block;font-size:20px}.nav.on{color:var(--g)}input,select{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;background:var(--bg);color:var(--t);font-size:16px;margin:5px 0 12px}label{font-size:12px;font-weight:700;color:var(--m)}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:end;z-index:10}.modal.on{display:flex}.sheet{background:var(--card);width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.danger{background:#fff0f0;color:var(--r);margin-top:8px}.tabs{display:flex;gap:7px;margin-bottom:10px}.tab{padding:8px 12px;border-radius:18px;border:1px solid var(--l);background:var(--card)}.tab.on{background:var(--g);color:#fff}.empty{text-align:center;color:var(--m);padding:25px}.dark{--bg:#101512;--card:#18201c;--t:#edf5f1;--m:#9aa9a1;--l:#2a3731}.dark .danger{background:#321b1b}
</style></head><body>
<header><div class="top"><div><div class="brand">FinanPY</div><div class="sub">Tus finanzas, en guaraníes 🇵🇾</div></div><button class="btn" style="padding:8px 11px" onclick="dark()">☾</button></div><div class="balance"><small style="color:#d5eee5">Saldo disponible</small><h1 id="bal">G. 0</h1></div><div class="cards"><div class="card"><small>Ingresos del mes</small><b class="green" id="inc">G. 0</b></div><div class="card"><small>Gastos del mes</small><b class="red" id="exp">G. 0</b></div></div></header>
<main class="wrap" id="main"></main><button class="fab" onclick="txModal()">＋</button>
<nav><button class="nav on" id="n0" onclick="home()"><b>⌂</b>Inicio</button><button class="nav" id="n1" onclick="historyPage()"><b>↕</b>Movimientos</button><button class="nav" id="n2" onclick="instPage()"><b>▣</b>Cuotas</button><button class="nav" id="n3" onclick="settings()"><b>⚙</b>Ajustes</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const $=id=>document.getElementById(id);
const K='finanpy';let d=JSON.parse(localStorage.getItem(K)||'{"tx":[],"ins":[],"dark":false}');if(d.dark)document.body.classList.add('dark');
const M=n=>'G. '+Math.round(+n||0).toLocaleString('es-PY'),T=()=>new Date().toISOString().slice(0,10),save=()=>{localStorage.setItem(K,JSON.stringify(d));render()},esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function due(i,n){let x=new Date(i.start+'T12:00');x.setMonth(x.getMonth()+n);x.setDate(Math.min(i.day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x.toISOString().slice(0,10)}
function render(){let b=d.tx.reduce((s,x)=>s+(x.type=='i'?+x.a:-+x.a),0),m=T().slice(0,7),i=d.tx.filter(x=>x.type=='i'&&x.date.slice(0,7)==m).reduce((s,x)=>s+ +x.a,0),e=d.tx.filter(x=>x.type=='e'&&x.date.slice(0,7)==m).reduce((s,x)=>s+ +x.a,0);bal.textContent=M(b);inc.textContent=M(i);exp.textContent=M(e)}
function home(){active(0);$('main').innerHTML='<div class="head"><h2>Próximo pago</h2><button class="link" onclick="instPage()">Ver cuotas</button></div><div id="next"></div><div class="head"><h2>Resumen</h2></div><div class="card chart" id="chart"></div><div class="head"><h2>Últimos movimientos</h2><button class="link" onclick="historyPage()">Ver todo</button></div><div id="recent" class="list"></div>';render();next();chart();recent()}
function active(n){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));document.getElementById('n'+n).classList.add('on')}
function next(){let a=[];d.ins.forEach(i=>{for(let n=0;n<i.count;n++)if(!(i.paid||[]).includes(n)){let q=due(i,n);if(q>=T())a.push({i,n,q});}});a.sort((x,y)=>x.q.localeCompare(y.q));let x=a[0];$('next').innerHTML=x?'<div class="up"><div><small>'+new Date(x.q+'T12:00').toLocaleDateString('es-PY')+'</small><b>'+esc(x.i.name)+' · Cuota '+(x.n+1)+'/'+x.i.count+'</b></div><b>'+M(x.i.amount)+'</b></div>':'<div class="up">No hay pagos pendientes ✓</div>'}
function chart(){let a=[];for(let k=5;k>=0;k--){let x=new Date();x.setMonth(x.getMonth()-k);let key=x.toISOString().slice(0,7),v=d.tx.filter(t=>t.type=='e'&&t.date.slice(0,7)==key).reduce((s,t)=>s+ +t.a,0);a.push({l:x.toLocaleDateString('es-PY',{month:'short'}),v})}let mx=Math.max(1,...a.map(x=>x.v));$('chart').innerHTML=a.map(x=>'<div class="barw"><div class="bar" style="height:'+Math.max(4,x.v/mx*105)+'px"></div><small>'+x.l+'</small></div>').join('')}
function row(x){return '<div class="row" onclick="editTx(\''+x.id+'\')"><i class="dot '+(x.type=='e'?'r':'')+'"></i><div class="main"><b>'+esc(x.desc||x.cat)+'</b><small>'+esc(x.cat)+' · '+new Date(x.date+'T12:00').toLocaleDateString('es-PY')+'</small></div><span class="amt '+(x.type=='e'?'red':'green')+'">'+(x.type=='e'?'-':'+')+M(x.a)+'</span></div>'}
function recent(){let a=d.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);$('recent').innerHTML=a.length?a.map(row).join(''):'<div class="empty">Todavía no tenés movimientos.</div>'}
function txModal(x){$('sheet').innerHTML='<h2>'+(x?'Editar':'Nuevo')+' movimiento</h2><label>Tipo</label><select id="ft"><option value="i">Ingreso</option><option value="e">Gasto</option></select><label>Monto (G.)</label><input id="fa" type="number"><label>Fecha</label><input id="fd" type="date" value="'+(x?x.date:T())+'"><label>Categoría</label><select id="fc"><option>Alimentación</option><option>Transporte</option><option>Vivienda</option><option>Estudios</option><option>Salud</option><option>Entretenimiento</option><option>Compras</option><option>Trabajo</option><option>Otros</option></select><label>Descripción</label><input id="fx" placeholder="Descripción"><button class="btn" onclick="saveTx(\''+(x?x.id:'')+'\')">Guardar</button>'+(x?'<button class="btn danger" onclick="delTx(\''+x.id+'\')">Eliminar</button>':'');if(x){$('ft').value=x.type;$('fa').value=x.a;$('fc').value=x.cat;$('fx').value=x.desc||''}$('modal').classList.add('on')}
function saveTx(id){let x={id:id||Date.now().toString(),type:$('ft').value,a:+$('fa').value,date:$('fd').value,cat:$('fc').value,desc:$('fx').value};if(!x.a||!x.date)return alert('Completá monto y fecha');let z=d.tx.findIndex(q=>q.id==id);z>=0?d.tx[z]=x:d.tx.push(x);close();home()}
function editTx(id){let x=d.tx.find(q=>q.id==id);if(x)txModal(x)}function delTx(id){if(confirm('¿Eliminar?')){d.tx=d.tx.filter(x=>x.id!=id);close();save();historyPage()}}
function historyPage(){active(1);$('main').innerHTML='<div class="head"><h2>Movimientos</h2><button class="link" onclick="txModal()">＋ Agregar</button></div><input id="search" placeholder="Buscar..." oninput="filter()"><div class="tabs"><button class="tab on" onclick="filterType(\'a\',this)">Todos</button><button class="tab" onclick="filterType(\'i\',this)">Ingresos</button><button class="tab" onclick="filterType(\'e\',this)">Gastos</button></div><div id="hist" class="list"></div>';window.ftype='a';filter()}
function filterType(t,b){ftype=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter()}function filter(){let q=($('search').value||'').toLowerCase(),a=d.tx.filter(x=>(ftype=='a'||x.type==ftype)&&(x.desc+' '+x.cat).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));$('hist').innerHTML=a.length?a.map(row).join(''):'<div class="empty">No hay movimientos.</div>'}
function instPage(){active(2);$('main').innerHTML='<div class="head"><h2>Cuotas</h2><button class="link" onclick="instModal()">＋ Nueva</button></div><div id="ilist" class="list"></div>';$('ilist').innerHTML=d.ins.length?d.ins.map(i=>{let p=(i.paid||[]).length,n=Array.from({length:i.count},(_,j)=>j).find(j=>!i.paid?.includes(j));return '<div class="row" onclick="openInst(\''+i.id+'\')"><div class="main"><b>'+esc(i.name)+'</b><small>'+p+'/'+i.count+' pagadas'+(n!==undefined?' · Próxima '+new Date(due(i,n)+'T12:00').toLocaleDateString('es-PY'):'')+'</small></div><b>'+M(i.amount)+'</b></div>'}).join(''):'<div class="empty">No tenés cuotas registradas.</div>'}
function instModal(){$('sheet').innerHTML='<h2>Nueva cuota</h2><label>Nombre</label><input id="iname" placeholder="Ej. Celular"><label>Monto total (G.)</label><input id="it" type="number" oninput="calc()"><label>Cantidad de cuotas</label><input id="ic" type="number" value="12" oninput="calc()"><label>Monto por cuota</label><input id="ia" type="number"><label>Primer vencimiento</label><input id="is" type="date" value="'+T()+'"><label>Día de vencimiento mensual</label><input id="iday" type="number" min="1" max="31" value="'+new Date().getDate()+'"><button class="btn" onclick="saveInst()">Crear cuotas</button>';$('modal').classList.add('on')}
function calc(){$('ia').value=Math.round((+$('it').value||0)/(+$('ic').value||1))}
function saveInst(){if(!$('iname').value||!$('it').value||!$('ic').value||!$('ia').value)return alert('Completá los datos');d.ins.push({id:Date.now().toString(),name:$('iname').value,total:+$('it').value,count:+$('ic').value,amount:+$('ia').value,start:$('is').value,day:+$('iday').value,paid:[]});close();save();instPage()}
function openInst(id){let i=d.ins.find(x=>x.id==id),n=Array.from({length:i.count},(_,j)=>j).find(j=>!(i.paid||[]).includes(j));$('sheet').innerHTML='<h2>'+esc(i.name)+'</h2><div class="card"><small>Total</small><b>'+M(i.total)+'</b><small>'+(i.paid||[]).length+'/'+i.count+' pagadas</small></div>'+(n===undefined?'<p>✓ Cuota completada</p>':'<button class="btn" onclick="pay(\''+id+'\','+n+')">Marcar cuota '+(n+1)+' como pagada · '+M(i.amount)+'</button>')+'<button class="btn danger" onclick="delInst(\''+id+'\')">Eliminar cuota</button>';$('modal').classList.add('on')}
function pay(id,n){let i=d.ins.find(x=>x.id==id);i.paid.push(n);d.tx.push({id:'p'+Date.now(),type:'e',a:i.amount,date:T(),cat:'Cuota',desc:i.name+' · Cuota '+(n+1)+'/'+i.count});close();save();instPage()}
function delInst(id){if(confirm('¿Eliminar esta cuota?')){d.ins=d.ins.filter(x=>x.id!=id);close();save();instPage()}}
function settings(){active(3);$('main').innerHTML='<h2>Ajustes</h2><div class="card"><b>FinanPY</b><p><small>Los datos se guardan en este iPhone.</small></p><button class="btn" onclick="dark()">Cambiar modo oscuro</button><button class="btn danger" onclick="wipe()">Borrar todos los datos</button></div><div class="card" style="margin-top:10px"><b>Recordatorios</b><p><small>FinanPY identifica los vencimientos 3 días antes. Las notificaciones automáticas requieren permiso y soporte de notificaciones web de Safari.</small></p></div>'}
function dark(){document.body.classList.toggle('dark');d.dark=document.body.classList.contains('dark');save()}function wipe(){if(confirm('¿Borrar todos los datos?')){d={tx:[],ins:[],dark:d.dark};save();home()}}function close(){$('modal').classList.remove('on')}$('modal').onclick=e=>{if(e.target==$('modal'))close()};home();
</script></body></html>
