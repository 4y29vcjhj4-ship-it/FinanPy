<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a7f4f"><title>FinanPY</title><link rel="manifest" href="manifest.json"><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7f5;margin:0;color:#17221c}header{background:#0a7f4f;color:#fff;padding:22px 18px 28px;border-radius:0 0 28px 28px}.bal{font-size:36px;font-weight:800;margin:8px 0 18px}.cards{display:flex;gap:10px}.card{background:#fff;padding:16px;border-radius:18px;flex:1;box-shadow:0 2px 10px #0000000b}.label{font-size:12px;color:#68756d}.value{font-size:18px;font-weight:700;margin-top:6px}.wrap{padding:16px}.section{font-weight:800;margin:18px 0 10px}.row{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:14px;border-radius:16px;margin:8px 0}.plus{position:fixed;right:20px;bottom:24px;width:58px;height:58px;border:0;border-radius:50%;background:#0a7f4f;color:#fff;font-size:30px;box-shadow:0 6px 18px #0003}button{font:inherit}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end}.sheet{background:#fff;width:100%;padding:22px;border-radius:25px 25px 0 0;box-sizing:border-box}.sheet input,.sheet select{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border:1px solid #ddd;border-radius:12px}.save{width:100%;padding:14px;border:0;border-radius:13px;background:#0a7f4f;color:white;font-weight:700;margin-top:8px}.cancel{width:100%;padding:12px;border:0;background:none}.danger{color:#c62828}.empty{color:#758078;text-align:center;padding:15px}</style></head><body><header><div>FinanPY 🇵🇾</div><div class="label" style="color:#d9fff0">DINERO DISPONIBLE</div><div class="bal" id="saldo">G. 0</div><div class="cards"><div class="card"><div class="label">Ingresos</div><div class="value" id="ing">G. 0</div></div><div class="card"><div class="card"><div class="label">Gastos</div><div class="value" id="gas">G. 0</div></div></div></div></header><main class="wrap"><div class="section">Próximos pagos</div><div id="cuotas"><div class="empty">Todavía no hay cuotas.</div></div><div class="section">Últimos movimientos</div><div id="movs"><div class="empty">Todavía no hay movimientos.</div></div></main><button class="plus" onclick="openModal()">+</button><div class="modal" id="modal"><div class="sheet"><h2>Nuevo movimiento</h2><select id="tipo"><option value="Ingreso">Ingreso</option><option value="Gasto">Gasto</option></select><input id="monto" inputmode="numeric" placeholder="Monto en guaraníes"><input id="cat" placeholder="Categoría (ej. Comida)"><input id="nota" placeholder="Descripción"><button class="save" onclick="save()">Guardar</button><button class="cancel" onclick="closeModal()">Cancelar</button></div></div><script>const K='finanpy_movs';const money=n=>'G. '+Math.round(n).toLocaleString('es-PY');const get=()=>JSON.parse(localStorage.getItem(K)||'[]');function render(){let a=get(),i=a.filter(x=>x.tipo==='Ingreso').reduce((s,x)=>s+x.monto,0),g=a.filter(x=>x.tipo==='Gasto').reduce((s,x)=>s+x.monto,0);saldo.textContent=money(i-g);ing.textContent=money(i);gas.textContent=money(g);movs.innerHTML=a.length?a.slice().reverse().slice(0,10).map((x,n)=>`<div class="row"><div><b>${x.cat||'Sin categoría'}</b><div class="label">${x.nota||''}</div></div><b class="${x.tipo==='Gasto'?'danger':''}">${x.tipo==='Ingreso'?'+':'-'}${money(x.monto)}</b></div>`).join(''):'<div class="empty">Todavía no hay movimientos.</div>'}function openModal(){modal.style.display='flex';monto.focus()}function closeModal(){modal.style.display='none'}function save(){let n=Number(monto.value.replace(/\D/g,''));if(!n)return alert('Ingresá un monto.');let a=get();a.push({tipo:tipo.value,monto:n,cat:cat.value,nota:nota.value,date:Date.now()});localStorage.setItem(K,JSON.stringify(a));monto.value=cat.value=nota.value='';closeModal();render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
