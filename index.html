<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FinanPY</title>
<style>
:root{--g:#087f5b;--g2:#0aa06f;--bg:#f4f7f6;--card:#fff;--t:#17211d;--m:#718078;--l:#dfe8e3;--r:#d64545;--y:#b77900;--shadow:0 8px 25px #17382b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:88px}
body.dark{--bg:#0e1411;--card:#18211c;--t:#edf5f1;--m:#9aaba2;--l:#2b3831;--shadow:0 8px 25px #0005}
header{background:linear-gradient(145deg,#087f5b,#064f3d);color:#fff;padding:20px 16px 24px;border-radius:0 0 28px 28px;box-shadow:0 5px 20px #064f3d30}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:27px;font-weight:850}.sub{color:#d5eee5;font-size:12px;margin-top:2px}.iconbtn{border:0;background:#ffffff20;color:#fff;border-radius:12px;width:42px;height:42px;font-size:20px}
.balance{margin-top:23px}.balance small{color:#d5eee5}.balance h1{margin:3px 0;font-size:37px;letter-spacing:-1px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.card,.row,.up{background:var(--card);border:1px solid var(--l);border-radius:17px;padding:14px;box-shadow:var(--shadow)}
.card b{display:block;font-size:18px;margin-top:5px}.green{color:var(--g)}.red{color:var(--r)}.gold{color:var(--y)}h2{font-size:19px;margin:20px 0 10px}
.wrap{max-width:720px;margin:auto;padding:15px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin-bottom:10px}
.up{display:flex;justify-content:space-between;align-items:center;gap:12px}.up b{display:block}.list{display:grid;gap:9px}
.row{display:flex;gap:11px;align-items:center;cursor:pointer}.dot{width:11px;height:11px;flex:0 0 11px;border-radius:50%;background:var(--g)}.dot.r{background:var(--r)}
.main{flex:1;min-width:0}.main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main small{display:block;margin-top:3px}.amt{font-weight:850;white-space:nowrap}
small{color:var(--m);font-size:12px}.btn{border:0;background:var(--g);color:#fff;border-radius:12px;padding:13px 15px;font-weight:800;font-size:15px}.btn:active,.fab:active{transform:scale(.98)}
.link{border:0;background:none;color:var(--g);font-weight:800}.fab{position:fixed;right:18px;bottom:77px;width:59px;height:59px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:28px;z-index:5;box-shadow:0 8px 20px #087f5b40}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--l);display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:6}
.nav{border:0;background:none;color:var(--m);font-size:11px}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav.on{color:var(--g)}
input,select{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;background:var(--bg);color:var(--t);font-size:16px;margin:5px 0 12px}label{font-size:12px;font-weight:750;color:var(--m)}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:10}.modal.on{display:flex}.sheet{background:var(--card);width:100%;max-height:91vh;overflow:auto;border-radius:25px 25px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px #0002}
.sheet h2{margin-top:2px}.sheet .btn{width:100%;margin-top:7px}.danger{background:#fff0f0;color:var(--r)}body.dark .danger{background:#321b1b}
.close{float:right;border:0;background:var(--bg);color:var(--t);width:36px;height:36px;border-radius:50%;font-size:20px}.tabs{display:flex;gap:7px;margin-bottom:10px;overflow:auto}.tab{white-space:nowrap;padding:8px 12px;border-radius:18px;border:1px solid var(--l);background:var(--card);color:var(--t)}.tab.on{background:var(--g);color:#fff}
.empty{text-align:center;color:var(--m);padding:28px 12px}.chart{height:180px;display:flex;align-items:end;gap:8px;padding-top:22px}.barw{flex:1;text-align:center;min-width:0}.bar{background:linear-gradient(#0aa06f,#087f5b);border-radius:7px 7px 2px 2px;min-height:4px}.barw small{display:block;margin-top:6px;font-size:10px}.section{margin-top:18px}
.alert{background:#fff7df;border:1px solid #f0d18a;color:#6d5000;border-radius:15px;padding:13px}.dark .alert{background:#302a19;color:#f2d37b;border-color:#5c4d27}
.progress{height:9px;background:var(--l);border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--g);border-radius:99px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:var(--m)}

/* FinanPY Pro+ */
.hero{background:linear-gradient(145deg,#087f5b,#064f3d);color:#fff;border-radius:20px;padding:17px;margin-top:10px}
.hero h3{margin:0 0 5px;font-size:18px}.hero p{margin:0;color:#d5eee5;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{background:var(--card);border:1px solid var(--l);border-radius:15px;padding:12px}.mini b{display:block;margin-top:4px;font-size:16px}
.goal{margin-top:9px}.goalhead{display:flex;justify-content:space-between}.goal .progress{margin-top:7px}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--l)}.switch input{width:48px;margin:0}
.badge{display:inline-block;padding:4px 8px;border-radius:10px;background:#e6f6f0;color:var(--g);font-size:11px;font-weight:800}.dark .badge{background:#183c30}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calhead,.calday{text-align:center;font-size:11px;padding:6px}.calhead{font-weight:800;color:var(--m)}.calday{min-height:45px;border:1px solid var(--l);border-radius:8px;background:var(--card)}.calday strong{display:block}.calday.pay{background:#e8f7f1;border-color:#9ed9c6}.dark .calday.pay{background:#17382d}.calday small{font-size:8px}
.notice{border-left:4px solid var(--g);padding:10px 12px;background:var(--card);border-radius:10px;margin:8px 0}
.install-card{padding:14px;border:1px solid var(--l);border-radius:17px;background:var(--card)}
@media(max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
 <div class="top"><div><div class="brand">FinanPY</div><div class="sub">Tus finanzas, en guaraníes 🇵🇾</div></div><button class="iconbtn" onclick="toggleDark()">☾</button></div>
 <div class="balance"><small>Saldo disponible</small><h1 id="bal">G. 0</h1></div>
 <div class="cards"><div class="card"><small>Ingresos del mes</small><b class="green" id="inc">G. 0</b></div><div class="card"><small>Gastos del mes</small><b class="red" id="exp">G. 0</b></div></div>
</header>
<main class="wrap" id="main"></main>
<button class="fab" onclick="txModal()">＋</button>
<nav>
 <button class="nav on" id="n0" onclick="home()"><b>⌂</b>Inicio</button>
 <button class="nav" id="n1" onclick="historyPage()"><b>↕</b>Movimientos</button>
 <button class="nav" id="n2" onclick="instPage()"><b>▣</b>Cuotas</button>
 <button class="nav" id="n3" onclick="settings()"><b>⚙</b>Ajustes</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $=id=>document.getElementById(id);
const KEY="finanpy_v2";
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>"G. "+Math.round(Number(n)||0).toLocaleString("es-PY");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function load(){
 try{
  const old=JSON.parse(localStorage.getItem(KEY)||"null");
  if(old){old.subs=old.subs||[];old.goals=old.goals||[];old.cards=old.cards||[];old.settings=old.settings||{reminders:true,face:false};return old;}
  const legacy=JSON.parse(localStorage.getItem("finanpy")||"null");
  if(legacy){legacy.subs=legacy.subs||[];legacy.goals=legacy.goals||[];legacy.cards=legacy.cards||[];legacy.settings=legacy.settings||{reminders:true,face:false};localStorage.setItem(KEY,JSON.stringify(legacy));return legacy}
 }catch(e){}
 return {tx:[],ins:[],dark:false,budget:0,subs:[],goals:[],cards:[],settings:{reminders:true,face:false}};
}
let d=load();
if(d.dark)document.body.classList.add("dark");

function persist(){localStorage.setItem(KEY,JSON.stringify(d));updateHeader()}
function updateHeader(){
 const bal=d.tx.reduce((s,x)=>s+(x.type==="i"?Number(x.a):-Number(x.a)),0);
 const ym=today().slice(0,7);
 const inc=d.tx.filter(x=>x.type==="i"&&x.date.slice(0,7)===ym).reduce((s,x)=>s+Number(x.a),0);
 const exp=d.tx.filter(x=>x.type==="e"&&x.date.slice(0,7)===ym).reduce((s,x)=>s+Number(x.a),0);
 $("bal").textContent=money(bal);$("inc").textContent=money(inc);$("exp").textContent=money(exp);
}

function setActive(n){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));$("n"+n).classList.add("on")}

function due(i,n){
 const x=new Date(i.start+"T12:00:00");
 x.setMonth(x.getMonth()+n);
 const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();
 x.setDate(Math.min(Number(i.day)||1,last));
 return x.toISOString().slice(0,10);
}
function daysUntil(date){
 const a=new Date(today()+"T12:00:00"),b=new Date(date+"T12:00:00");
 return Math.round((b-a)/86400000);
}
function pending(){
 const a=[];
 d.ins.forEach(i=>{
  for(let n=0;n<i.count;n++){
   if(!(i.paid||[]).some(p=>p.n===n || p===n)){
    const q=due(i,n);a.push({i,n,q,days:daysUntil(q)});
   }
  }
 });
 return a.sort((a,b)=>a.q.localeCompare(b.q));
}

function home(){
 setActive(0);
 $("main").innerHTML=`
 <div id="rem"></div>
 <div class="head"><h2>Próximo pago</h2><button class="link" onclick="instPage()">Ver cuotas</button></div>
 <div id="next"></div>
 <div class="head"><h2>Resumen</h2></div>
 <div class="card chart" id="chart"></div>
 <div class="head"><h2>Últimos movimientos</h2><button class="link" onclick="historyPage()">Ver todo</button></div>
 <div id="recent" class="list"></div>`;
 updateHeader();renderReminder();renderNext();renderChart();renderRecent();
}

function renderReminder(){
 const dueSoon=pending().filter(x=>x.days>=0&&x.days<=3); const ym=today().slice(0,7); d.subs.forEach(s=>{const q=subscriptionNext(s),days=daysUntil(q);if(days>=0&&days<=3&&!(s.paid||[]).includes(ym))dueSoon.push({i:{name:s.name,count:"∞",amount:s.amount},n:0,q,days});});
 $("rem").innerHTML=dueSoon.length?`<div class="alert"><b>🔔 Próximos vencimientos</b><br><small>${dueSoon.slice(0,2).map(x=>`${esc(x.i.name)} · cuota ${x.n+1}/${x.i.count} · ${x.days===0?"vence hoy":x.days===1?"vence mañana":"vence en "+x.days+" días"}`).join("<br>")}</small></div>`:"";
}
function renderNext(){
 const x=pending().find(x=>x.days>=0);
 $("next").innerHTML=x?`<div class="up"><div><small>${new Date(x.q+"T12:00:00").toLocaleDateString("es-PY")} · ${x.days===0?"Hoy":x.days+" días"}</small><b>${esc(x.i.name)} · Cuota ${x.n+1}/${x.i.count}</b></div><b>${money(x.i.amount)}</b></div>`:`<div class="up">No hay pagos pendientes ✓</div>`;
}
function renderChart(){
 const a=[];
 for(let k=5;k>=0;k--){const x=new Date();x.setMonth(x.getMonth()-k);const key=x.toISOString().slice(0,7),v=d.tx.filter(t=>t.type==="e"&&t.date.slice(0,7)===key).reduce((s,t)=>s+Number(t.a),0);a.push({l:x.toLocaleDateString("es-PY",{month:"short"}),v})}
 const mx=Math.max(1,...a.map(x=>x.v));
 $("chart").innerHTML=a.map(x=>`<div class="barw"><div class="bar" style="height:${Math.max(5,x.v/mx*112)}px"></div><small>${x.l}</small></div>`).join("");
}
function txRow(x){
 return `<div class="row" onclick="editTx('${x.id}')"><i class="dot ${x.type==="e"?"r":""}"></i><div class="main"><b>${esc(x.desc||x.cat)}</b><small>${esc(x.cat)} · ${new Date(x.date+"T12:00:00").toLocaleDateString("es-PY")}</small></div><span class="amt ${x.type==="e"?"red":"green"}">${x.type==="e"?"-":"+"}${money(x.a)}</span></div>`;
}
function renderRecent(){
 const a=d.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 $("recent").innerHTML=a.length?a.map(txRow).join(""):`<div class="empty">Todavía no tenés movimientos.</div>`;
}

function txModal(x){
 $("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${x?"Editar":"Nuevo"} movimiento</h2>
 <label>Tipo</label><select id="ft"><option value="i">Ingreso</option><option value="e">Gasto</option></select>
 <label>Monto (G.)</label><input id="fa" type="number" inputmode="numeric" placeholder="100000">
 <label>Fecha</label><input id="fd" type="date" value="${x?x.date:today()}">
 <label>Categoría</label><select id="fc"><option>Alimentación</option><option>Transporte</option><option>Vivienda</option><option>Estudios</option><option>Salud</option><option>Entretenimiento</option><option>Compras</option><option>Trabajo</option><option>Servicios</option><option>Otros</option></select>
 <label>Descripción</label><input id="fx" placeholder="Ej. Sueldo, supermercado...">
 <button class="btn" onclick="saveTx('${x?x.id:""}')">Guardar</button>
 ${x?`<button class="btn danger" onclick="deleteTx('${x.id}')">Eliminar</button>`:""}`;
 if(x){$("ft").value=x.type;$("fa").value=x.a;$("fc").value=x.cat;$("fx").value=x.desc||""}
 $("modal").classList.add("on");
}
function saveTx(id){
 const a=Number($("fa").value);
 if(!a||a<0||!$("fd").value)return alert("Completá monto y fecha");
 const x={id:id||uid(),type:$("ft").value,a,date:$("fd").value,cat:$("fc").value,desc:$("fx").value.trim()};
 const idx=d.tx.findIndex(q=>q.id===id);
 if(idx>=0)d.tx[idx]=x;else d.tx.push(x);
 persist();closeModal();home();
}
function editTx(id){const x=d.tx.find(q=>q.id===id);if(x)txModal(x)}
function deleteTx(id){if(confirm("¿Eliminar este movimiento?")){d.tx=d.tx.filter(x=>x.id!==id);persist();closeModal();historyPage()}}

let ftype="a";
function historyPage(){
 setActive(1);
 $("main").innerHTML=`<div class="head"><h2>Movimientos</h2><button class="link" onclick="txModal()">＋ Agregar</button></div>
 <input id="search" placeholder="🔎 Buscar movimiento..." oninput="filterHistory()">
 <div class="tabs"><button class="tab on" onclick="filterType('a',this)">Todos</button><button class="tab" onclick="filterType('i',this)">Ingresos</button><button class="tab" onclick="filterType('e',this)">Gastos</button></div>
 <div id="hist" class="list"></div>`;
 ftype="a";filterHistory();
}
function filterType(t,b){ftype=t;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");filterHistory()}
function filterHistory(){
 const q=($("search").value||"").toLowerCase();
 const a=d.tx.filter(x=>(ftype==="a"||x.type===ftype)&&(x.desc+" "+x.cat).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
 $("hist").innerHTML=a.length?a.map(txRow).join(""):`<div class="empty">No hay movimientos.</div>`;
}

function instPage(){
 setActive(2);
 $("main").innerHTML=`<div class="head"><h2>Pagos</h2><button class="link" onclick="subModal()">＋ Mensualidad</button></div>
 <div class="tabs"><button class="tab on" onclick="instPage()">Cuotas con fin</button><button class="tab" onclick="showSubs()">Mensualidades</button><button class="tab" onclick="calendarPage()">Calendario</button></div>
 <div id="ilist" class="list"></div>`;
 const a=d.ins;
 $("ilist").innerHTML=a.length?a.map(i=>{
  const p=(i.paid||[]).length,n=Array.from({length:i.count},(_,j)=>j).find(j=>!(i.paid||[]).some(v=>v===j||v.n===j));
  const q=n===undefined?null:due(i,n);
  return `<div class="row" onclick="openInst('${i.id}')"><div class="main"><b>${esc(i.name)}</b><small>${p}/${i.count} pagadas${q?" · Próxima "+new Date(q+"T12:00:00").toLocaleDateString("es-PY"):" · Completada"}</small></div><b>${money(i.amount)}</b></div>`;
 }).join(""):`<div class="empty">No tenés cuotas con cantidad definida.</div>`;
}
function showSubs(){
 setActive(2);
 $("main").innerHTML=`<div class="head"><h2>Mensualidades</h2><button class="link" onclick="subModal()">＋ Nueva</button></div>
 <div class="notice">Estas no usan formato 1/10. Se renuevan cada mes hasta que vos las elimines.</div><div id="subs" class="list"></div>`;
 $("subs").innerHTML=d.subs.length?d.subs.map(s=>{
  const q=subscriptionNext(s),key=today().slice(0,7),paid=(s.paid||[]).includes(key);
  return `<div class="install-card"><div class="head"><div><b>${esc(s.name)}</b><small>${esc(s.cat)} · día ${s.day} de cada mes</small></div><b>${money(s.amount)}</b></div><div class="section"><span class="badge">${paid?"✓ Pagada este mes":"Pendiente este mes"}</span> <small>Próximo: ${new Date(q+"T12:00:00").toLocaleDateString("es-PY")}</small></div><div class="actions section"><button class="btn" onclick="subPay('${s.id}')">${paid?"Ya pagada":"Pagar este mes"}</button><button class="btn danger" onclick="deleteSub('${s.id}')">Eliminar</button></div></div>`;
 }).join(""):`<div class="empty">Agregá Wi‑Fi, Spotify, Netflix u otra mensualidad.</div>`;
}
function instModal(){
 $("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Nueva cuota</h2>
 <label>Nombre</label><input id="iname" placeholder="Ej. Celular">
 <label>Monto total (G.)</label><input id="it" type="number" inputmode="numeric" oninput="calcInstallment()" placeholder="1200000">
 <label>Cantidad de cuotas</label><input id="ic" type="number" inputmode="numeric" value="12" oninput="calcInstallment()">
 <label>Monto por cuota</label><input id="ia" type="number" inputmode="numeric">
 <label>Primer vencimiento</label><input id="is" type="date" value="${today()}">
 <label>Día de vencimiento mensual</label><input id="iday" type="number" min="1" max="31" value="${new Date().getDate()}">
 <button class="btn" onclick="saveInstallment()">Crear cuotas</button>`;
 $("modal").classList.add("on");
}
function calcInstallment(){const t=Number($("it").value)||0,c=Number($("ic").value)||1;$("ia").value=Math.round(t/c)}
function saveInstallment(){
 const total=Number($("it").value),count=Number($("ic").value),amount=Number($("ia").value);
 if(!$("iname").value||!total||!count||!amount)return alert("Completá los datos");
 d.ins.push({id:uid(),name:$("iname").value.trim(),total,count,amount,start:$("is").value,day:Number($("iday").value),paid:[]});
 persist();closeModal();instPage();
}
function openInst(id){
 const i=d.ins.find(x=>x.id===id);if(!i)return;
 const n=Array.from({length:i.count},(_,j)=>j).find(j=>!(i.paid||[]).some(v=>v===j||v.n===j));
 let rows="";
 for(let j=0;j<i.count;j++){const paid=(i.paid||[]).some(v=>v===j||v.n===j),q=due(i,j);rows+=`<div class="row"><div class="main"><b>Cuota ${j+1}/${i.count}</b><small>${new Date(q+"T12:00:00").toLocaleDateString("es-PY")}</small></div><span class="${paid?"green":"gold"}">${paid?"✓ Pagada":"Pendiente"}</span></div>`}
 $("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${esc(i.name)}</h2>
 <div class="kpis"><div class="card"><small>Total</small><b>${money(i.total)}</b></div><div class="card"><small>Cuota</small><b>${money(i.amount)}</b></div></div>
 <div class="section"><small>Progreso</small><div class="progress"><i style="width:${Math.min(100,(i.paid||[]).length/i.count*100)}%"></i></div><small>${(i.paid||[]).length} de ${i.count} pagadas</small></div>
 <div class="section list">${rows}</div>
 ${n===undefined?"<div class='up' style='margin-top:10px'>✓ Cuota completada</div>":`<button class="btn" onclick="payInstallment('${id}',${n})">Marcar cuota ${n+1} como pagada · ${money(i.amount)}</button>`}
 <button class="btn danger" onclick="deleteInstallment('${id}')">Eliminar cuota</button>`;
 $("modal").classList.add("on");
}
function payInstallment(id,n){
 const i=d.ins.find(x=>x.id===id);if(!i)return;
 if(!i.paid)i.paid=[];
 if(i.paid.some(v=>v===n||v.n===n))return;
 i.paid.push(n);
 d.tx.push({id:uid(),type:"e",a:i.amount,date:today(),cat:"Cuota",desc:`${i.name} · Cuota ${n+1}/${i.count}`});
 persist();closeModal();instPage();
}
function deleteInstallment(id){if(confirm("¿Eliminar esta cuota y su programación?")){d.ins=d.ins.filter(x=>x.id!==id);persist();closeModal();instPage()}}


function subModal(){
 $("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Mensualidad</h2>
 <div class="notice">Ideal para Wi‑Fi, Spotify, Netflix, gimnasio, teléfono, etc. <b>No tiene número final de cuotas.</b></div>
 <label>Servicio</label><input id="sn" placeholder="Ej. Wi‑Fi">
 <label>Monto mensual (G.)</label><input id="sa" type="number" inputmode="numeric" placeholder="150000">
 <label>Día de cobro</label><input id="sd" type="number" min="1" max="31" value="10">
 <label>Primera fecha</label><input id="ss" type="date" value="${today()}">
 <label>Categoría</label><select id="sc"><option>Servicios</option><option>Entretenimiento</option><option>Internet</option><option>Suscripciones</option><option>Transporte</option><option>Otros</option></select>
 <button class="btn" onclick="saveSub()">Crear mensualidad</button>`;
 $("modal").classList.add("on");
}
function saveSub(){
 const a=Number($("sa").value),n=$("sn").value.trim(),day=Number($("sd").value);
 if(!n||!a||!day)return alert("Completá los datos");
 d.subs.push({id:uid(),name:n,amount:a,day,start:$("ss").value,cat:$("sc").value,paid:[]});
 persist();closeModal();instPage();
}
function subPay(id){
 const s=d.subs.find(x=>x.id===id);if(!s)return;
 const key=today().slice(0,7);
 if((s.paid||[]).includes(key))return alert("La mensualidad de este mes ya está pagada.");
 s.paid=s.paid||[];s.paid.push(key);
 d.tx.push({id:uid(),type:"e",a:s.amount,date:today(),cat:s.cat,desc:`${s.name} · Mensualidad ${key}`});
 persist();instPage();
}
function deleteSub(id){if(confirm("¿Eliminar esta mensualidad?")){d.subs=d.subs.filter(x=>x.id!==id);persist();instPage()}}
function subscriptionNext(s){
 const now=new Date();let y=now.getFullYear(),m=now.getMonth(),day=Math.min(s.day,new Date(y,m+1,0).getDate());
 let q=new Date(y,m,day);
 if(q<new Date(today()+"T12:00:00")){m++;q=new Date(y,m,Math.min(s.day,new Date(y,m+1,0).getDate()))}
 return q.toISOString().slice(0,10);
}
function goalModal(){
 $("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Meta de ahorro</h2>
 <label>Nombre</label><input id="gn" placeholder="Ej. Auto">
 <label>Monto objetivo (G.)</label><input id="ga" type="number" inputmode="numeric">
 <label>Ya ahorrado (G.)</label><input id="gs" type="number" inputmode="numeric" value="0">
 <button class="btn" onclick="saveGoal()">Crear meta</button>`;
 $("modal").classList.add("on");
}
function saveGoal(){const n=$("gn").value.trim(),a=Number($("ga").value),s=Number($("gs").value)||0;if(!n||!a)return alert("Completá los datos");d.goals.push({id:uid(),name:n,target:a,saved:s});persist();closeModal();settings()}
function addGoalMoney(id){const g=d.goals.find(x=>x.id===id);if(!g)return;const a=Number(prompt("¿Cuánto querés agregar a esta meta?","50000"));if(a>0){g.saved+=a;persist();settings()}}
function calendarPage(){
 setActive(2);
 const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
 let h=`<div class="head"><h2>Calendario</h2><button class="link" onclick="instPage()">Volver</button></div><div class="calendar">`;
 ["L","M","X","J","V","S","D"].forEach(x=>h+=`<div class="calhead">${x}</div>`);
 let offset=(first.getDay()+6)%7;for(let i=0;i<offset;i++)h+="<div></div>";
 for(let day=1;day<=last.getDate();day++){let ds=new Date(y,m,day).toISOString().slice(0,10);let names=[];pending().filter(x=>x.q===ds).forEach(x=>names.push(x.i.name));d.subs.forEach(s=>{if(Number(s.day)===day)names.push(s.name)});h+=`<div class="calday ${names.length?"pay":""}"><strong>${day}</strong><small>${esc(names.slice(0,2).join(", "))}</small></div>`}
 h+="</div>";$("main").innerHTML=h;
}
function faceID(){
 if(!window.PublicKeyCredential)return alert("Este navegador no ofrece WebAuthn/Face ID para esta función.");
 PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?.().then(ok=>{
  if(!ok)return alert("Este dispositivo/navegador no tiene un autenticador biométrico disponible para FinanPY.");
  alert("Tu iPhone es compatible con autenticación biométrica web. Para activar Face ID como bloqueo de FinanPY necesitamos registrar una credencial WebAuthn en una versión con servidor seguro; no voy a fingir que el bloqueo ya está activo.");
 }).catch(()=>alert("No se pudo comprobar Face ID en este navegador."));
}

function settings(){
 setActive(3);
 const size=new Blob([JSON.stringify(d)]).size, ym=today().slice(0,7);
 const exp=d.tx.filter(x=>x.type==="e"&&x.date.slice(0,7)===ym).reduce((s,x)=>s+Number(x.a),0);
 const rem=d.budget?Math.max(0,d.budget-exp):0;
 $("main").innerHTML=`<h2>Ajustes y herramientas</h2>
 <div class="hero"><h3>FinanPY Pro+ 🇵🇾</h3><p>Controlá gastos, cuotas, mensualidades, metas y respaldos desde un solo lugar.</p></div>
 <div class="card section"><b>Presupuesto mensual</b><p><small>Gastado: ${money(exp)}${d.budget?` · Disponible: ${money(rem)}`:""}</small></p><input id="budget" type="number" inputmode="numeric" value="${d.budget||""}" placeholder="Ej. 3000000"><button class="btn" onclick="saveBudget()">Guardar presupuesto</button></div>
 <div class="section"><div class="head"><h2>Metas de ahorro</h2><button class="link" onclick="goalModal()">＋ Nueva</button></div><div class="list">${d.goals.length?d.goals.map(g=>`<div class="mini goal"><div class="goalhead"><b>${esc(g.name)}</b><small>${money(g.saved)} / ${money(g.target)}</small></div><div class="progress"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><button class="link" onclick="addGoalMoney('${g.id}')">＋ Agregar ahorro</button></div>`).join(""):`<div class="empty">Creá una meta como auto, viaje o emergencia.</div>`}</div></div>
 <div class="card section"><b>Seguridad</b>
 <div class="switch"><span>Bloqueo biométrico / Face ID</span><button class="link" onclick="faceID()">Configurar</button></div>
 <div class="switch"><span>Recordatorios dentro de FinanPY</span><span class="badge">3 días antes</span></div></div>
 <div class="card section"><b>Copia de seguridad</b><p><small>${d.tx.length} movimientos · ${d.ins.length} cuotas · ${d.subs.length} mensualidades · ${d.goals.length} metas · ${Math.round(size/1024)} KB</small></p><div class="actions"><button class="btn" onclick="exportData()">⬇️ Exportar</button><button class="btn" onclick="importData()">⬆️ Restaurar</button></div></div>
 <div class="card section"><b>Datos</b><p><small>Los datos actuales están guardados localmente en este dispositivo.</small></p><button class="btn danger" onclick="wipe()">Borrar todos los datos</button></div>`;
}
function saveBudget(){d.budget=Number($("budget").value)||0;persist();settings()}
function exportData(){
 const blob=new Blob([JSON.stringify({...d,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="FinanPY-respaldo.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(){
 const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
 input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.tx)||!Array.isArray(x.ins))throw 0;if(confirm("Esto reemplazará los datos actuales. ¿Continuar?")){d={tx:x.tx,ins:x.ins,subs:x.subs||[],goals:x.goals||[],cards:x.cards||[],settings:x.settings||{reminders:true,face:false},dark:!!x.dark,budget:Number(x.budget)||0};persist();home()}}catch(e){alert("El archivo no es un respaldo válido de FinanPY.")}};r.readAsText(f)};input.click();
}
function toggleDark(){d.dark=!d.dark;document.body.classList.toggle("dark",d.dark);persist()}
function wipe(){if(confirm("¿Borrar TODOS los datos de FinanPY? Esta acción no se puede deshacer.")){d={tx:[],ins:[],subs:[],goals:[],cards:[],settings:{reminders:true,face:false},dark:d.dark,budget:0};persist();home()}}
function closeModal(){$("modal").classList.remove("on")}
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
updateHeader();home();
</script>
</body>
</html>
